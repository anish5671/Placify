server.port=${PORT:8080}
spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=lazy

# Set database credentials and the JWT signing key through environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/preptrack_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:preptrack}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Configure APP_JWT_SECRET with a Base64-encoded random key containing at least 32 bytes.
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:}}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Configure SMTP to enable password reset emails.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${SMTP_FROM:}

# User submissions are executed by Judge0 CE and never on this Spring Boot host.
judge0.base-url=${JUDGE0_BASE_URL:https://ce.judge0.com}
judge0.auth-token=${JUDGE0_AUTH_TOKEN:}

# Resume Analyzer
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
resume.max-file-size-bytes=${RESUME_MAX_FILE_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=${RESUME_MAX_FILE_SIZE_BYTES:10485760}
spring.servlet.multipart.max-request-size=${RESUME_MAX_FILE_SIZE_BYTES:10485760}

# Logging
logging.level.com.placify=INFO
logging.level.org.springframework.security=WARN
