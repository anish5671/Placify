server.port=${PORT:8080}

# Set database credentials and the JWT signing key through environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/preptrack_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:preptrack}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Configure APP_JWT_SECRET with a Base64-encoded random key containing at least 32 bytes.
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:}}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}

# User submissions are executed by Judge0 CE and never on this Spring Boot host.
judge0.base-url=${JUDGE0_BASE_URL:https://ce.judge0.com}
judge0.auth-token=${JUDGE0_AUTH_TOKEN:}

# Logging
logging.level.com.placify=INFO
logging.level.org.springframework.security=WARN
